    <script>
      // Ensure window.fetch has both a getter and a setter across window and its prototype chain
      // so Chrome extensions, test runners, and proxy interceptors can safely reassign window.fetch.
      (function() {
        try {
          var rawFetch = window.fetch;
          var origFetch = (rawFetch && rawFetch.bind) ? rawFetch.bind(window) : rawFetch;
          var customFetch = null;
          var desc = {
            configurable: true,
            enumerable: true,
            get: function() {
              return customFetch || origFetch;
            },
            set: function(val) {
              customFetch = val;
            }
          };
          try {
            Object.defineProperty(window, 'fetch', desc);
          } catch (e1) {}
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', desc);
            }
          } catch (e2) {}
          try {
            if (window.__proto__) {
              Object.defineProperty(window.__proto__, 'fetch', desc);
            }
          } catch (e3) {}
        } catch (e) {}
      })();
    </script>
